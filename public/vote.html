<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Vote</title>
                <script src="/socket.io/socket.io.js"></script>
                
                <style>
                    :root {
                        --bg: #121212;
                        --text: #ffffff;
                        --card: #1e1e1e;
                        --accent: #ff9800;
                        --poll: #2196F3;
                        --reaction: #333;
                    }
                    
                    body {
                        font-family:sans-serif;
                        text-align:center;
                        padding:20px;
                        margin:0;
                        background:var(--bg);
                        color:var(--text);
                        transition:background 0.3s, color 0.3s;
                    }
                    
                    .section { margin:25px 0; }
                    
                    /* Poll Buttons */
                    #pollOptions button {
                        width:100%;
                        font-size:18px;
                        padding:14px;
                        margin:6px 0;
                        border:none;
                        border-radius:8px;
                        background:var(--poll);
                        color:white;
                        transition:background 0.2s, transform 0.1s;
                        position:relative;
                    }
                    
                    #pollOptions button:active {
                        transform:scale(0.98);
                    }
                    
                    /* Selected poll answer */
                    #pollOptions button.selected {
                        background:#4CAF50;
                        color:white;
                        font-weight:bold;
                    }
                    
                    /* Checkmark */
                    .poll-check {
                        float:right;
                        font-size:22px;
                        font-weight:bold;
                        margin-left:8px;
                    }
                    
                    /* Rating Buttons (smaller) */
                    .rating-buttons button {
                        width:100%;
                        font-size:20px;
                        padding:12px;
                        margin:5px 0;
                        border:none;
                        border-radius:8px;
                        background:var(--accent);
                        color:white;
                    }
                    
                    /* Reaction Grid */
                    .reaction-grid {
                        display:grid;
                        grid-template-columns: repeat(6,1fr);
                        gap:8px;
                    }
                    
                    .reaction-grid button {
                        font-size:22px;
                        padding:10px;
                        border:none;
                        border-radius:8px;
                        background:var(--reaction);
                        color:white;
                    }
                    
                    button {
                        touch-action: manipulation;
                        cursor:pointer;
                    }
                    
                    /* Theme Toggle */
                    .theme-toggle {
                        margin-top:40px;
                        font-size:14px;
                        opacity:0.8;
                    }
                    
                    .theme-toggle button {
                        padding:8px 14px;
                        border:none;
                        border-radius:6px;
                        background:#444;
                        color:white;
                    }
                    
                    .leaderboard-section {
                        margin-top:40px;
                        padding-top:20px;
                        border-top:1px solid #444;
                    }

                    #voteLeaderboard {
                        max-width:600px;
                        margin:0 auto;
                        padding-left:40px;
                        text-align:left;
                    }

                    #voteLeaderboard li {
                        padding:8px 10px;
                        margin:4px 0;
                        border-radius:6px;
                        background:var(--card);
                    }

                    #voteLeaderboard .leader-1 {
                        color:gold;
                        font-weight:bold;
                    }

                    #voteLeaderboard .leader-2 {
                        color:silver;
                        font-weight:bold;
                    }

                    #voteLeaderboard .leader-3 {
                        color:#cd7f32;
                        font-weight:bold;
                    }
                    
                </style>
    </head>
    <body>
        
        <!-- POLL (TOP) -->
        <div class="section">
            <h2 id="pollQuestion"></h2>
            <div id="pollOptions"></div>
        </div>
        
        <h1>Rate This Video</h1>
        
        <div class="section rating-buttons">
            <button onclick="vote(1)">⭐</button>
            <button onclick="vote(2)">⭐⭐</button>
            <button onclick="vote(3)">⭐⭐⭐</button>
            <button onclick="vote(4)">⭐⭐⭐⭐</button>
            <button onclick="vote(5)">⭐⭐⭐⭐⭐</button>
        </div>
        
        <div class="section">
            <h2>React</h2>
            <div class="reaction-grid">
                <button onclick="react('🔥')">🔥</button>
                <button onclick="react('😂')">😂</button>
                <button onclick="react('👏')">👏</button>
                <button onclick="react('😮')">😮</button>
                <button onclick="react('🫡')">🫡</button>
                <button onclick="react('😢')">😢</button>
                <button onclick="react('👀')">👀</button>
                <button onclick="react('💯')">💯</button>
                <button onclick="react('👍')">👍</button>
                <button onclick="react('👎')">👎</button>
                
                <!-- NEW EMOJIS -->
                <button onclick="react('🤘')">🤘</button>
                <button onclick="react('🔊')">🔊</button>
                <button onclick="react('🥁')">🥁</button>
                <button onclick="react('🎸')">🎸</button>
                <button onclick="react('🎶')">🎶</button>
                <button onclick="react('🎤')">🎤</button>
                <button onclick="react('😈')">😈</button>
                <button onclick="react('😭')">😭</button>
                <button onclick="react('🙌')">🙌</button>
                <button onclick="react('❤️')">❤️</button>
                <button onclick="react('🥰')">🥰</button>
            </div>
        </div>
        
        <!-- DARK/LIGHT TOGGLE -->
        <div class="theme-toggle">
            <button onclick="toggleTheme()">Toggle Light / Dark Mode</button>
        </div>
        
        <div class="section leaderboard-section">

            <h2>🏆 Leaderboard</h2>

            <ol id="voteLeaderboard"></ol>

        </div>
        
        <script>
            const socket = io();
            let settings = {};
            let selectedPollOption = null;
            const voteLeaderboard = document.getElementById('voteLeaderboard');
            
            /* =========================
             THEME SYSTEM
             ========================= */
            
            function setLightMode() {
                document.documentElement.style.setProperty('--bg','#ffffff');
                document.documentElement.style.setProperty('--text','#000000');
                document.documentElement.style.setProperty('--card','#f5f5f5');
                document.documentElement.style.setProperty('--reaction','#ddd');
                localStorage.setItem('theme','light');
            }
            
            function setDarkMode() {
                document.documentElement.style.setProperty('--bg','#121212');
                document.documentElement.style.setProperty('--text','#ffffff');
                document.documentElement.style.setProperty('--card','#1e1e1e');
                document.documentElement.style.setProperty('--reaction','#333');
                localStorage.setItem('theme','dark');
            }
            
            function toggleTheme() {
                if(localStorage.getItem('theme') === 'light') {
                    setDarkMode();
                } else {
                    setLightMode();
                }
            }
            
            async function updateVoteLeaderboard(){

                try {

                    const res = await fetch('/api/leaderboard');
                    const data = await res.json();

                    const mode = settings.leaderboardMode || "top5";

                    let leaderboard = data
                        .filter(v => v.count > 0)
                        .sort((a,b) => b.avg - a.avg);

                    if(mode === "top5"){
                        leaderboard = leaderboard.slice(0,5);
                    }

                    voteLeaderboard.innerHTML = "";

                    leaderboard.forEach((video, index)=>{

                        const li = document.createElement('li');

                        const medal =
                            index === 0 ? "🥇 " :
                            index === 1 ? "🥈 " :
                            index === 2 ? "🥉 " :
                            "";

                        const title =
                            video.title.replace(/\.[^/.]+$/, "");

                        const shortTitle =
                            title.length > 40
                                ? title.substring(0,40) + "..."
                                : title;

                        li.innerText =
                            `${medal}${shortTitle} — ${Number(video.avg).toFixed(2)} ⭐ (${video.count})`;

                        if(index === 0)
                            li.classList.add("leader-1");

                        if(index === 1)
                            li.classList.add("leader-2");

                        if(index === 2)
                            li.classList.add("leader-3");

                        voteLeaderboard.appendChild(li);
                    });

                } catch(err) {

                    console.error(
                        "Failed to load leaderboard:",
                        err
                    );

                }
            }
            
            /* Load saved theme */
            if(localStorage.getItem('theme') === 'light') {
                setLightMode();
            } else {
                setDarkMode();
            }
            
            /* =========================
             LEADERBOARD STUFF
             ========================= */
            
            socket.on('leaderboard_refresh', ()=>{
                updateVoteLeaderboard();
            });
            
            /* =========================
             POLL EVENTS
             ========================= */
            socket.on('poll_started', (poll)=>{
                document.querySelector('.section').style.display = "block";
                renderPoll(poll);
            });
            
            socket.on('poll_closed', (poll)=>{
                disableButtons();

                document.getElementById('pollQuestion').innerText =
                    poll.question + " — Results";

                renderPollResults(poll);
            });
            
            socket.on('poll_cleared', ()=>{
                document.getElementById('pollQuestion').innerText="";
                document.getElementById('pollOptions').innerHTML="";
                document.querySelector('#pollOptions').parentElement.style.display = "none";

                selectedPollOption = null;
            });
            
            function renderPoll(poll){
                const section = document.querySelector('#pollOptions').parentElement;
                section.style.display = "block";

                document.getElementById('pollQuestion').innerText = poll.question;

                const container = document.getElementById('pollOptions');
                container.innerHTML = "";

                poll.options.forEach((opt, i) => {

                    const btn = document.createElement('button');

                    btn.dataset.optionText = opt;

                    const text = document.createElement('span');
                    text.className = 'poll-option-text';
                    text.innerText = opt;

                    btn.appendChild(text);

                    btn.onclick = () => submitVote(i, btn, opt);

                    container.appendChild(btn);
                });
            }
            
            function renderPollResults(poll){

                const container = document.getElementById('pollOptions');

                const total = Object.values(poll.counts)
                    .reduce((sum, count) => sum + count, 0);

                container.innerHTML = "";

                poll.options.forEach((opt, i)=>{

                    const count = poll.counts[i] || 0;
                    const percentage = total
                        ? ((count / total) * 100).toFixed(1)
                        : "0.0";

                    const wrapper = document.createElement('div');
                    wrapper.style.marginBottom = "12px";
                    wrapper.style.textAlign = "left";

                    const label = document.createElement('div');

                    label.innerText =
                        `${opt} — ${count} vote${count === 1 ? "" : "s"} (${percentage}%)`;

                    label.style.marginBottom = "4px";

                    const barContainer = document.createElement('div');

                    barContainer.style.width = "100%";
                    barContainer.style.height = "18px";
                    barContainer.style.background = "#333";
                    barContainer.style.borderRadius = "6px";
                    barContainer.style.overflow = "hidden";

                    const bar = document.createElement('div');

                    bar.style.width = `${percentage}%`;
                    bar.style.height = "100%";
                    bar.style.background = "#2196F3";

                    barContainer.appendChild(bar);

                    wrapper.appendChild(label);
                    wrapper.appendChild(barContainer);

                    /*
                     * Keep the user's selection highlighted
                     */
                    if (i === selectedPollOption) {

                        wrapper.style.background = "#4CAF50";
                        wrapper.style.color = "white";
                        wrapper.style.padding = "10px";
                        wrapper.style.borderRadius = "8px";
                        wrapper.style.fontWeight = "bold";

                        label.innerText =
                            `✓ ${opt} — ${count} vote${count === 1 ? "" : "s"} (${percentage}%)`;
                    }

                    container.appendChild(wrapper);
                });
            }
            
            function disableButtons(){
                document.querySelectorAll('#pollOptions button')
                .forEach(btn=>btn.disabled=true);
            }
            
            async function submitVote(index, btn, optionText){

                if(navigator.vibrate) navigator.vibrate(50);

                selectedPollOption = index;

                // Keep the selected option green
                btn.classList.add('selected');

                const text = btn.querySelector('.poll-option-text');

                if(text){
                    text.innerText = `You picked: ${optionText}`;
                }

                // Add checkmark
                const check = document.createElement('span');
                check.className = 'poll-check';
                check.innerText = '✓';

                btn.appendChild(check);

                // Disable all choices, but leave them visible
                disableButtons();

                try {

                    const res = await fetch('/api/poll_vote',{
                        method:'POST',
                        headers:{
                            'Content-Type':'application/json'
                        },
                        body:JSON.stringify({
                            optionIndex:index
                        })
                    });

                    if(!res.ok){
                        console.error("Poll vote rejected:", res.status);
                    }

                } catch(err) {
                    console.error("Poll vote failed:", err);
                }
            }
            
            socket.on('settings_update', (newSettings)=>{
                settings = newSettings;
                updateVoteLeaderboard();
            });
            
            async function loadActivePoll(){
                try {
                    const res = await fetch('/api/current');
                    const data = await res.json();
                    
                    // poll is sent via socket on connect already
                    // but this ensures fallback if missed
                } catch {}
            }
            
            loadActivePoll();
            
            async function loadSettings(){
                const res = await fetch('/api/settings');
                settings = await res.json();
               
               // Load leaderboard after settings are known
                updateVoteLeaderboard();
            }
            loadSettings();
            
            /* =========================
             VIDEO RATING
             ========================= */
            async function vote(rating){
                if(navigator.vibrate) navigator.vibrate(30);
                
                await fetch('/api/vote',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({rating})
                });
                
            }
            
            /* =========================
             REACTIONS
             ========================= */
            async function react(emoji){
                if(navigator.vibrate) navigator.vibrate(20);
                
                const res = await fetch('/api/reaction',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({emoji})
                });
                
            }
        </script>
        
    </body>
</html>
